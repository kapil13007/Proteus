services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapflow
      POSTGRES_PASSWORD: mapflow
      POSTGRES_DB: mapflow
    ports:
      - "5433:5432"
    volumes:
      - mapflow_pg:/var/lib/postgresql/data
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapflow"]
      interval: 5s
      retries: 10

volumes:
  mapflow_pg:
